name: daily-threads-post

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 두면 실제 발행 없이 초안/이미지만 생성"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토큰 상태 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/state
          key: threads-state-${{ github.run_id }}
          restore-keys: |
            threads-state-
      - name: 1단계 - 밸런스게임 선택 및 초안 생성
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
        run: python scripts/prepare.py

      - name: 카드 이미지·초안 커밋 (공개 URL 확보)
        id: commit_draft
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards data/draft.json
          git commit -m "chore: draft $(date -u +%F)" || echo "변경 없음"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 2단계 - Threads·Instagram 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.commit_draft.outputs.sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/publish.py

      - name: 결과 기록 커밋
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/last_result.json
          git commit -m "chore: result $(date -u +%F)" || echo "변경 없음"
          git push
