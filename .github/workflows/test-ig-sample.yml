name: test-ig-sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토큰 상태 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/state
          key: threads-state-${{ github.run_id }}
          restore-keys: |
            threads-state-

      - name: IG 샘플 발행 테스트
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}
        run: python scripts/test_ig_sample.py
